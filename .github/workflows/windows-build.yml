name: L.o.S.A. Windows Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "feature/v0.7-minecraft-dependencies"
      - "feature/v0.8-minecraft-launch"
      - "feature/v0.9-authentication-foundation"
      - "feature/v0.9.1-install-state"
      - "feature/v0.9.2-offline-profiles"
      - "feature/launcher-experience-0.10"
      - "feature/accent-presets-0.10.4"
      - "feature/community-polish-0.10.6"
      - "feature/bedrock-mods-workshop-0.10.8"
      - "feature/bedrock-runtime-0.10.10"
      - "feature/bedrock-runtime-0.10.12"
      - "feature/bedrock-runtime-0.10.14"
      - "feature/cosmetic-3d-workshop-0.10.9"
  push:
    branches:
      - "feature/v0.8-minecraft-launch"
      - "feature/v0.9-authentication-foundation"
      - "feature/v0.9.1-install-state"
      - "feature/v0.9.2-offline-profiles"
      - "feature/launcher-experience-0.10"
      - "feature/referrals-and-roles-0.10.7"
      - "feature/bedrock-mods-workshop-0.10.8"
      - "feature/bedrock-runtime-0.10.10"
      - "feature/bedrock-runtime-0.10.12"
      - "feature/bedrock-runtime-0.10.14"
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install
        working-directory: ./losa-launcher

      - name: Build Windows installer
        env:
          LOSA_MICROSOFT_CLIENT_ID: ${{ vars.LOSA_MICROSOFT_CLIENT_ID }}
        run: npm run desktop:build
        working-directory: ./losa-launcher

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: L-o-S-A-Windows-Installer
          path: losa-launcher/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
