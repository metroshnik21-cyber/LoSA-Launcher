
name: L.o.S.A. Windows Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "feature/v0.7-minecraft-dependencies"
      - "feature/v0.8-minecraft-launch"
      - "feature/v0.9-authentication-foundation"
  push:
    branches:
      - "feature/v0.8-minecraft-launch"
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install
        working-directory: ./losa-launcher

      - name: Build Windows installer
        env:
          LOSA_MICROSOFT_CLIENT_ID: ${{ vars.LOSA_MICROSOFT_CLIENT_ID }}
        run: npm run desktop:build
        working-directory: ./losa-launcher

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: L-o-S-A-Windows-Installer
          path: losa-launcher/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
