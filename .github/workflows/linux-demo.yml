name: L.o.S.A. Linux Demo
on:
  workflow_dispatch:
  push:
    branches:
      - "demo/linux-showcase"
jobs:
  build-linux-demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev python3-pil
      - name: Normalize Tauri icons to RGBA
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          icons = Path("losa-launcher/src-tauri/icons")
          for path in icons.glob("*.png"):
              image = Image.open(path).convert("RGBA")
              image.save(path, format="PNG")
              print(f"Prepared {path}: RGBA {image.size}")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: ./losa-launcher
        run: npm install
      - name: Build Linux AppImage demo
        working-directory: ./losa-launcher
        run: npm run desktop:build -- --bundles appimage
      - uses: actions/upload-artifact@v4
        with:
          name: LOSA-Linux-Demo-AppImage
          path: losa-launcher/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
